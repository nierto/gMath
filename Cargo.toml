[package]
name = "g_math"
version = "0.6.7"
edition = "2021"
# integration tests are four group binaries (tests/<group>.rs), not one per file
autotests = false
description = "Multi-domain fixed-point arithmetic with geometric extension: Lie groups, manifolds, ODE solvers, tensors, fiber bundles — pure Rust, zero-float, deterministic"
authors = ["Niels Erik Toren"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/nierto/g_math"
homepage = "https://github.com/nierto/g_math"
documentation = "https://docs.rs/g_math"
keywords = ["fixed-point", "arithmetic", "precision", "mathematics", "no-float"]
categories = ["mathematics", "algorithms"]
build = "build.rs"

[build-dependencies]
# Pure Rust BigInt for build-time table generation
# Used for exp/ln/trig lookup tables and rational arithmetic constants
num-bigint = "0.4"
num-traits = "0.2"
num-rational = "0.4"
num-integer = "0.1"

[dependencies]
# Optional: arbitrary-precision rational arithmetic (BigInt tier 8)
num-traits = { version = "0.2", optional = true }
num-bigint = { version = "0.4", optional = true }
num-integer = { version = "0.1", optional = true }
# Optional: serde serialization support
serde = { version = "1", features = ["derive"], optional = true }
# Optional: gmath!() proc-macro for compile-time literal parsing (published separately)
# g_math_macros = { path = "g_math_macros", optional = true }

[dev-dependencies]
criterion = "0.4"
proptest = "1.0"
approx = "0.5"
num-bigint = "0.4"
num-rational = "0.4"

[features]
default = []

# Optional: BigInt tier 8 in RationalNumber (unbounded precision)
infinite-precision = ["dep:num-bigint", "dep:num-traits", "dep:num-integer"]

# Feature gates for optional subsystems
legacy-tests = []        # Enable compilation of legacy test suites
rebuild-tables = []      # Regenerate lookup tables from build.rs (~20 min)
serde = ["dep:serde"]    # Serialize/Deserialize impls for Fixed, FixedVector, FixedMatrix, Tensor
# macros = ["dep:g_math_macros"]    # gmath!() — deferred to separate crate publish

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(q16_16)', 'cfg(q32_32)', 'cfg(q64_64)', 'cfg(q128_128)', 'cfg(q256_256)', 'cfg(q512_512)',
    'cfg(feature, values("rebuild-tables", "serde"))',
    'cfg(gmath_all_splits)', 'cfg(gmath_edge_splits)',
]

[profile.release]
debug = false
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
debug = true
lto = true
opt-level = 3

[[test]]
name = "transcendentals"
path = "tests/transcendentals.rs"

[[test]]
name = "decimal_canonical"
path = "tests/decimal_canonical.rs"

[[test]]
name = "linalg"
path = "tests/linalg.rs"

[[test]]
name = "geometry"
path = "tests/geometry.rs"

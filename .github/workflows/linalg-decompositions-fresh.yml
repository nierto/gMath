# Fresh randomized decomposition corpus, weekly and on demand.
#
# Draws a new seed, regenerates tests/data/decomposition_random_refs.rs with
# mpmath (pinned, in a virtualenv), and runs the randomized gate at every
# format in one build. The committed corpus runs on every push in ci.yml;
# this job keeps drawing cases no one has looked at. The log prints the
# seed, and a failing case names the command that reproduces its corpus.
name: linalg-decompositions-fresh

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      seed:
        description: "Corpus seed (empty: the run id)"
        required: false
        default: ""

jobs:
  fresh-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (plain git - no external actions)
        run: |
          git init -q
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Install mpmath
        run: |
          python3 -m venv /tmp/refs-venv
          /tmp/refs-venv/bin/pip install -q mpmath==1.3.0

      - name: Draw the corpus
        env:
          INPUT_SEED: ${{ github.event.inputs.seed }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SEED="${INPUT_SEED:-$RUN_ID}"
          echo "corpus seed: $SEED"
          /tmp/refs-venv/bin/python scripts/generate_decomposition_refs.py --random --seed "$SEED" --cases 64

      - name: Randomized decomposition gate
        run: |
          cargo test --release --no-fail-fast --test decomposition_convergence_validation random_corpus -- --nocapture

name: decimal-precision

# Publicly proves gMath's decimal-domain correctness on every push/PR against
# an external corpus (the decimal_fixed unit tests and the rounding-mode gate
# run in the full suite of ci.yml, every format in one build):
#
#  contract-harness - the full contract sweep against mootable/decimal-scaled's
#     independent, adversarial mpmath corpus (pinned). Grades BOTH user-reachable
#     decimal paths (imperative DecimalFixed + canonical gmath()/FASC) for all 15
#     transcendentals, plus atan2 and add/sub/mul/div, at 0 LSB.
#
# Uses NO third-party or GitHub-authored actions - checkout is a plain `git fetch`
# (gMath is a public repo) and the ubuntu runner already ships stable Rust. This
# keeps the repo runnable under the most restrictive "Allow <owner> actions"
# policy (and trivially satisfies "require actions pinned to a full SHA", since no
# actions are used). Free on this public repo.

on:
  push:
  pull_request:

jobs:
  contract-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (plain git - no external actions)
        run: |
          git init -q
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      # Oracle #2: decimal-scaled's adversarial golden corpus, pinned to the
      # exact commit gMath was validated against. Not vendored into this repo.
      # Fetched by SHA: since 2026-09-16 the pinned commit is no longer on any
      # upstream branch, so a clone cannot check it out ("reference is not a
      # tree"), while GitHub still serves the commit itself.
      - name: Fetch decimal-scaled golden corpus (pinned)
        run: |
          mkdir -p "${{ runner.temp }}/decimal-scaled"
          cd "${{ runner.temp }}/decimal-scaled"
          git init -q
          git remote add origin https://github.com/mootable/decimal-scaled.git
          git fetch -q --depth 1 origin e6c7497832be437cf464d07b841609a0b92aac87
          git checkout -q FETCH_HEAD

      # Single-threaded: the sweep swaps the panic hook around catch_unwind.
      - name: Decimal contract validation (oracle #1 + oracle #2)
        env:
          GMATH_DECIMAL_SCALED_GOLDEN: ${{ runner.temp }}/decimal-scaled
        run: |
          cargo test --release --test decimal_canonical decimal_contract_validation:: -- --test-threads=1 --nocapture

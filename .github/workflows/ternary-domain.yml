name: ternary-domain

# Publicly proves the balanced-ternary domain on every push/PR — the 0.4.33
# contract suite (docs/design/BALANCED_TERNARY_CONTRACT.md):
#
#  1. ternary_domain_validation — native trit-vector reference oracle,
#     exhaustive small-range add/sub/mul/neg equivalence, boundary families,
#     and the tie-free rounding theorem (3^m odd => round-to-nearest onto a
#     3-adic grid never ties; trit truncation IS round-to-nearest).
#
#  2. ternary_path_equivalence — UGOD tier promotion at raw-overflow
#     boundaries, canonical (FASC 0t literals) vs imperative (UGOD)
#     equivalence, cross-domain coercion neutrality, and the fractional
#     0t-literal conversion pins (incl. the "-0.x" sign regression).
#
# Both suites are profile-independent; realtime + compact cover the two
# cheap-build profiles (pre-built tables, ~2s builds). Uses NO third-party
# or GitHub-authored actions — checkout is a plain `git fetch` (gMath is a
# public repo) and the ubuntu runner already ships stable Rust.

on:
  push:
  pull_request:

jobs:
  ternary-contract:
    strategy:
      fail-fast: false
      matrix:
        profile: [realtime, compact]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (plain git - no external actions)
        run: |
          git init -q
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Ternary contract suites
        env:
          GMATH_PROFILE: ${{ matrix.profile }}
        run: |
          cargo test --test ternary_domain_validation
          cargo test --test ternary_path_equivalence

      # Router + cross-domain suites on the narrow profiles. These hid a
      # realtime-only parse defect for months because no CI job ran them
      # there (ROADMAP 0.5.0 item 0, fixed): oversized integer literals
      # errored instead of falling back to Symbolic.
      - name: Router + domain integration
        env:
          GMATH_PROFILE: ${{ matrix.profile }}
        run: |
          cargo test --test fractal_router_integration
          cargo test --test domain_arithmetic_validation

      - name: Rounding unification gate (one rule per domain, every path)
        env:
          GMATH_PROFILE: ${{ matrix.profile }}
        run: cargo test --test rounding_unification

      # UGOD ladder-top gate (0.5.0 item 1): arithmetic on representable
      # inputs is exact — via a wider tier or the symbolic fallback — or
      # fails loud. Pre-fix, every ladder's TOP wrapped silently.
      - name: UGOD promotion gate (exact or loud, never wrapped)
        env:
          GMATH_PROFILE: ${{ matrix.profile }}
        run: cargo test --test ugod_promotion_validation

      # Certified interval gate: directed rounding brackets the nearest
      # scalar by at most one ulp (negatives and constructed ties included),
      # the enclosure invariant holds against exact integer references, and
      # the sqrt certificate k^2 <= n < (k+1)^2 holds on every sampled input.
      - name: Certified interval gate (enclosure, directed rounding, sqrt certificate)
        env:
          GMATH_PROFILE: ${{ matrix.profile }}
        run: cargo test --test interval_enclosure
